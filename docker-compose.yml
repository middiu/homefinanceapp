services:
  homefinance:
    build: .
    container_name: homefinance
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      PORT: 4000
      DATABASE_URL: /data/homefinance.sqlite
      BACKUP_DIR: /data/backups
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_BASE_URL: ${AI_BASE_URL:-https://ollama.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-llama3.1}
      AI_DIGEST_CRON: ${AI_DIGEST_CRON:-0 7 * * 1}
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./data:/data
      - ./backups:/data/backups