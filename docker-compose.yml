# Podman/Docker Compose. Tested with `podman compose`.
# Named volumes persist the SQLite DB and backups across image rebuilds and
# can be reused by a new image without data loss.
services:
  homefinance:
    build: .
    container_name: homefinance
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      PORT: 4000
      DATABASE_URL: /data/homefinance.sqlite
      BACKUP_DIR: /backups
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_BASE_URL: ${AI_BASE_URL:-https://ollama.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-llama3.1}
      AI_DIGEST_CRON: ${AI_DIGEST_CRON:-0 7 * * 1}
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      # Reusable named volume: survives image rebuilds, not lost on `podman compose down`.
      - homefinance-db:/data
      - homefinance-backups:/backups
    # Label for podman (harmless under docker).
    labels:
      io.containers.autoupdate: "registry"

volumes:
  homefinance-db:
  homefinance-backups: