# Podman/Docker Compose. Tested with `podman compose`.
# Named volumes persist the SQLite DB and backups across image rebuilds and
# can be reused by a new image without data loss.
services:
  homefinance:
    build: .
    container_name: homefinance
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      PORT: 4000
      DATABASE_URL: /data/homefinance.sqlite
      BACKUP_DIR: /backups
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_BASE_URL: ${AI_BASE_URL:-https://ollama.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_GROK_API_KEY: ${AI_GROK_API_KEY:-}
      AI_CURSOR_API_KEY: ${AI_CURSOR_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_DIGEST_CRON: ${AI_DIGEST_CRON:-0 7 * * 1}
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      # ---- Auth ----
      # No inline default here: when unset, config.ts falls back to 'Pa$$word!'
      # (a JS string literal — unambiguous). A compose inline default would mangle
      # $$ → $ due to compose's $-escaping.
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      SESSION_TTL_MS: ${SESSION_TTL_MS:-604800000}
      AUTH_MAX_FAILS: ${AUTH_MAX_FAILS:-5}
      AUTH_LOCKOUT_MS: ${AUTH_LOCKOUT_MS:-300000}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    volumes:
      # Reusable named volume: survives image rebuilds, not lost on `podman compose down`.
      - homefinance-db:/data
      - homefinance-backups:/backups
    # Label for podman (harmless under docker).
    labels:
      io.containers.autoupdate: "registry"

volumes:
  homefinance-db:
  homefinance-backups: